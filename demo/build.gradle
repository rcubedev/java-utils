plugins {
    id 'java-library'
    id 'application'
    id 'com.gradleup.shadow' version '9.6.1'
}

base {
    archivesName = 'java_utils_demo'
}

repositories {
    mavenCentral()
    maven { url 'https://repo.sleeping.town/' }
}

dependencies {
    // use the published library instead when using this demo as a standalone project
    api project(':')

    implementation 'org.slf4j:slf4j-api:2.0.9'

    compileOnly 'org.jetbrains:annotations:24.1.0'

    runtimeOnly 'org.apache.logging.log4j:log4j-api:2.22.1'
    runtimeOnly 'org.apache.logging.log4j:log4j-core:2.22.1'
    runtimeOnly 'org.apache.logging.log4j:log4j-slf4j2-impl:2.22.1'
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21

    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }

    modularity.inferModulePath = true
}

application {
    mainClass = 'com.github.rcubedev.demo.Main'
}

def archiveNameProvider = project.base.archivesName
jar {
    inputs.property 'archivesName', archiveNameProvider

    from('LICENSE') {
        into 'META-INF'
        rename { "${it}_${archiveNameProvider.get()}" }
    }

    manifest {
        attributes(
                'Main-Class': application.mainClass.get()
        )
    }
}

tasks.named('shadowJar') {
    from('LICENSE') {
        into 'META-INF'
        rename { "${it}_${archiveNameProvider.get()}" }
    }
}